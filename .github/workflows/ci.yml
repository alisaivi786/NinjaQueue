name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore NinjaQueue.slnx --locked-mode
      - name: Build
        run: dotnet build NinjaQueue.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/NinjaQueue.Tests -c Release --no-build
      - name: Integration tests (PostgreSQL 16 + SQL Server 2022 via Testcontainers)
        run: dotnet test tests/NinjaQueue.IntegrationTests -c Release --no-build