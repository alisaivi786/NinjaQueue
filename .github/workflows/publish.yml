name: Publish to nuget.org

# Push a tag like v0.1.0-preview.1 (or v1.0.0) to build, test, pack and publish every NinjaQueue package with that version.
on:
  push:
    tags: ['v*']

# nuget.org Trusted Publishing: no API key is stored. GitHub's OIDC token (id-token: write) is exchanged by NuGet/login for a
# short-lived key, which nuget.org grants only to this repository, this workflow file and the "Production" environment.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NinjaQueue.Dashboard/ui/package-lock.json
      - name: Dashboard UI
        working-directory: src/NinjaQueue.Dashboard/ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore NinjaQueue.slnx --locked-mode
      - name: Build
        run: dotnet build NinjaQueue.slnx -c Release --no-restore -p:Version=$VERSION -p:ContinuousIntegrationBuild=true
      - name: Test
        run: |
          dotnet test tests/NinjaQueue.Tests -c Release --no-build
          dotnet test tests/NinjaQueue.IntegrationTests -c Release --no-build
      - name: Pack
        run: dotnet pack NinjaQueue.slnx -c Release --no-build -p:Version=$VERSION -o artifacts
      - name: nuget.org login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate